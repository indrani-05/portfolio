<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <style>
        /* Reset default browser styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

/* Style the body */
body {
    background-color: #f0f8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Style the form */
form {
    background-color: #d6f0ff; /* light blue form background */
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 350px;
}

/* Form elements */
form div {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
}

/* Submit button */
button {
    background-color: #28a745; /* green color */
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background-color: #218838;
}

    </style>
</head>
<body>
    <form>
        <b>SIGN IN YOUR A/C:</b>
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your full name">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email">
        </div><div>
            <label for="password">Password</label>
            <input id="password" type="number" placeholder="Enter your password">
        </div>
        <div>
            <label for="mobile">Mobile no.</label>
            <input id="mobile" type="number" placeholder="Enter your mobile no.">
        </div>
        <div>
            <button action="submit.php">Submit</button>
        </div>
    </form>
</body>
</html>
